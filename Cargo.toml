[package]
name = "gitpulse"
version = "0.3.0"
edition = "2021"
description = "Terminal dashboard for managing multiple Git repositories"

[dependencies]
ratatui = "0.29"
git2 = "0.19"
octocrab = "0.44"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
crossterm = "0.28"
chrono = "0.4"
