[package]
name = "gitpulse"
version = "0.9.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
git2 = "0.19"
octocrab = "0.54"
ratatui = "0.29"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
